<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMLHttpRequest Lab</title>
</head>
<body>

  <h2>Lab Exercise 2: Exploring XMLHttpRequest</h2>

  <button id="loadData">Load Post Data</button>

  <div id="output" style="margin-top: 20px; border: 1px solid #ddd; padding: 10px;"></div>

  <script>
    var button = document.getElementById("loadData");
    var output = document.getElementById("output");

    button.addEventListener("click", function () {

      var xhr = new XMLHttpRequest();

      xhr.onreadystatechange = function () {

        if (xhr.readyState === 4) {

          if (xhr.status === 200) {
            var data = JSON.parse(xhr.responseText);

            output.innerHTML = "<strong>Post Title:</strong> " + data.title +
                               "<br><br>" +
                               "<strong>Content:</strong> " + data.body;
          } else {
            output.innerHTML = "<span style='color:red;'>Error: " + xhr.status + "</span>";
          }
        }
      };
      
      xhr.open("GET", "https://jsonplaceholder.typicode.com/posts/1", true);

      xhr.send();
    });
  </script>

</body>
</html>
